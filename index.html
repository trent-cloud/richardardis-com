<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!--
  richardardis.com is retired. Every address on this domain sends the visitor to
  woodlarkassociates.co.uk, and none of the former content is served any more.

  GitHub Pages cannot issue an HTTP 301, so the redirect is done three ways in
  the page itself, in order of how fast each fires:
    1. location.replace() in the head — instant, and leaves no history entry, so
       Back does not bounce the visitor straight back into the redirect.
    2. <meta http-equiv="refresh" content="0"> — the no-JavaScript fallback.
       Search engines read an instant meta refresh as a permanent redirect, which
       is what passes this domain's accumulated signals to Woodlark.
    3. A plain link in the body — the last resort if both are blocked.
  rel=canonical names the destination so nothing here is indexed in its own right.

  Every retired page keeps a file at its old address rather than 404ing, so an
  existing link or index entry gets a 200 and a real redirect instead of a dead
  end. 404.html catches everything else.
-->
<title>Redirecting to Woodlark Associates</title>
<link rel="canonical" href="https://woodlarkassociates.co.uk/">
<meta http-equiv="refresh" content="0; url=https://woodlarkassociates.co.uk/">
<script>window.location.replace("https://woodlarkassociates.co.uk/");</script>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:#faf8f3;color:#1e4d3b;
    font:16px/1.6 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
  main{padding:24px;text-align:center}
  a{color:#1e4d3b}
</style>
</head>
<body>
<main>
  <p>Redirecting to <a href="https://woodlarkassociates.co.uk/">woodlarkassociates.co.uk</a>.</p>
</main>
</body>
</html>
